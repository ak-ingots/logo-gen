[project]
name = "logo-gen"
version = "0.1.0"
description = "Ingot stack logo generator: SVG + PNG renders and a grid of camera angles."
requires-python = ">=3.15"
classifiers = [
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "cairosvg",
    "fonttools",
    "pillow",
]

[project.scripts]
logo-gen = "logo_gen.render:cli"
logo-gen-grid = "logo_gen.grid:cli"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "logo_gen"
module-root = ""

[tool.uv]
# Linux only: the font is taken from a Debian/Ubuntu system path (FONT).
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "flake8-pyproject",
    "mypy",
]

[tool.black]
line-length = 88

[tool.flake8]
exclude = [".git", ".venv"]
max-line-length = 88
extend-ignore = ["E203", "E701", "E704"]

[tool.mypy]
strict = true
python_version = "3.15"
enable_error_code = ["deprecated"]

[[tool.mypy.overrides]]
module = ["cairosvg", "fontTools.*"]
ignore_missing_imports = true
